ktor:
    application:
        modules:
          - com.github.oursharecar.server.ApplicationKt.module
    deployment:
        port: 8080

security:
  jwt:
    domain: "https://jwt-provider-domain/"
    audience: "jwt-audience"
    realm: "ktor sample app"

mongodb:
  connectionString: "mongodb://localhost:27017"
  database: "oursharecar"
  collections:
    group: "groups"
